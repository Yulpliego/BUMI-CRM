name: nexo-crm
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexo_crm
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo -d nexo_crm"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${CRM_ENVIRONMENT:-Development}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Crm: "Host=db;Database=nexo_crm;Username=nexo;Password=${POSTGRES_PASSWORD}"
      DemoPassword: ${DEMO_PASSWORD:?Define DEMO_PASSWORD en .env}
      CrmKeysPath: /keys
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - keys:/keys

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${CRM_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  database:
  keys:
