name: bumi-crm
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexo_crm
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nexo -d nexo_crm"]
      interval: 4s
      timeout: 3s
      retries: 15
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${CRM_ENVIRONMENT:-Development}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Crm: "Host=db;Database=nexo_crm;Username=nexo;Password=${POSTGRES_PASSWORD}"
      DemoPassword: ${DEMO_PASSWORD:?Define DEMO_PASSWORD en .env}
      CrmKeysPath: /keys
      BumiDemo__Enabled: ${BUMI_DEMO_ENABLED:-false}
      RecoveryMail__PublicOrigin: ${RECOVERY_MAIL_ORIGIN:-http://127.0.0.1:${CRM_WEB_PORT:-8080}}
      RecoveryMail__Host: ${RECOVERY_MAIL_HOST:-}
      RecoveryMail__Port: ${RECOVERY_MAIL_PORT:-587}
      RecoveryMail__From: ${RECOVERY_MAIL_FROM:-}
      RecoveryMail__Username: ${RECOVERY_MAIL_USERNAME:-}
      RecoveryMail__Password: ${RECOVERY_MAIL_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - keys:/keys

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CRM_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 4s
      retries: 12

volumes:
  database:
  keys:
